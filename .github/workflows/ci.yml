# The pipeline (docs/developer/library.md, section 8): tests on every push; a push to master that changes the
# software and passes the checks becomes a release - the signed slot for the boxes and the package for the NAS. The
# library on the NAS finds the release and fetches the slot; the boxes install it by themselves.
# The workflow stays thin: checks, builds and the comparison of tag and version are scripts in the repository.
# Every action is pinned to a commit (dependabot proposes the next one, .github/dependabot.yml).
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a run takes ~2 min - the default of 6 h would let a hanging run block the queue
    strategy:
      matrix:
        python: ["3.13", "3.12"]  # 3.13: the boxes and the PC; 3.12: the library on the NAS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install ffmpeg (player tests) and dbus-daemon (bluetooth driver tests on a private bus)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg dbus

      - name: Install
        run: uv sync --locked --all-groups --python ${{ matrix.python }}

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml --durations=10

      - name: Coverage summary
        if: always() && matrix.python == '3.13'
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  # The app for phones (app/, docs/developer/app.md): the sync module is tested against a library of
  # this commit, started with tinyjukebox-library --data DIR.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install the library
        run: uv sync --locked --python 3.13

      - name: Sync module
        run: app/gradlew -p app :sync:test

  # Nothing becomes a release without the job "test" (section 8.1). The build runs on every push, so that a change
  # that breaks the slot or the package is noticed at once. It may only read. Only a push to master signs with the
  # keys of the releases, which are secrets of the environment "release" that only master may use; every other
  # branch signs with keys made for its run, which no box and no phone trusts - signing and checking are tried all the
  # same. Each key is given to the one step that needs it.
  build:
    needs: [test, app]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # the slot is built for aarch64 in an emulated container
    environment: ${{ github.ref == 'refs/heads/master' && 'release' || '' }}  # empty: no environment
    permissions:
      contents: read
    outputs:
      release: ${{ steps.needed.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # with the tags of the releases
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # on a branch other than master a missing bump is a warning: the branch is built all the same
      - name: Release needed
        id: needed
        run: scripts/ci/release_needed.sh >> "$GITHUB_OUTPUT"

      # the app for phones is built into the release as well (scripts/build_app.sh)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      # what takes long to build for the boxes - the compiled libraries, rfid-reader - is kept between the runs and
      # reused while it is unchanged (scripts/build_slot.sh --cache)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/tinyjukebox/slot
          key: slot-${{ hashFiles('uv.lock', 'cpp/rfid-reader/**', 'scripts/fetch_python.sh', 'deploy/ansible/group_vars/all/main.yaml') }}
          restore-keys: slot-

      # in an aarch64 container, without any key: it runs code of others
      - name: Slot
        run: scripts/ci/build.sh slot

      - name: Sign the slot
        env:
          SIGNING_KEY: ${{ github.ref == 'refs/heads/master' && secrets.SIGNING_KEY || '' }}
        run: scripts/ci/build.sh sign

      - name: App
        env:
          APP_SIGNING_KEY: ${{ github.ref == 'refs/heads/master' && secrets.APP_SIGNING_KEY || '' }}
          APP_SIGNING_PASSWORD: ${{ github.ref == 'refs/heads/master' && secrets.APP_SIGNING_PASSWORD || '' }}
        run: scripts/ci/build.sh app

      - name: Installer, package, wheel
        run: scripts/ci/build.sh package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # the image for this computer from the wheel of this build: a library and a box linked to it
      - name: Image
        run: scripts/ci/test_image.sh

  # A push to master that needs a release publishes what the job "build" built and tried - its artifact, nothing
  # built anew. Only this job may write; it runs in the environment "release". One at a time: a second push right
  # after the first decided on its release before the first had its tag, and would publish its own build under the
  # same version - so the job asks again, with the tags of now, and publishes only the release of its own commit.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.release == 'true'
    concurrency:
      group: publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45  # the image for arm64 is built emulated
    environment: release
    permissions:
      contents: write  # the job creates tag and release
      packages: write  # ... publishes the image to the registry of GitHub
      id-token: write  # ... and proves its identity to PyPI (Trusted Publishing)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # with the tags of the releases
          persist-credentials: false

      # the tag of the version on this commit: its own release, the job is run again. Otherwise as the job "build"
      # decided, with the tags of now - a release of an earlier commit with this version ends the job here
      - name: Release still needed
        id: again
        run: |
          TAG=v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          if [ "$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)" = "$GITHUB_SHA" ]; then
            echo release=true >> "$GITHUB_OUTPUT"
          else
            scripts/ci/release_needed.sh >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.again.outputs.release == 'true'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.again.outputs.release == 'true'
        with:
          name: dist
          path: dist

      - name: Release
        if: steps.again.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release_github.sh

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.again.outputs.release == 'true' && !github.event.repository.private
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.again.outputs.release == 'true' && !github.event.repository.private

      # the image and PyPI publish the code: only from a public repository. The boxes depend on the release only
      - name: Publish the image
        if: steps.again.outputs.release == 'true' && !github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish_image.sh

      - name: Publish on PyPI
        if: steps.again.outputs.release == 'true' && !github.event.repository.private
        run: scripts/ci/publish_pypi.sh
