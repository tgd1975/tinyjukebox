# sound: Audio Amp SHIM with the software volume control 'Softmaster' (docs/developer/box.md)
- name: Look up the sound cards
  ansible.builtin.command: aplay -l
  register: audio_cards
  changed_when: false
  failed_when: false

- name: The sound card of the Audio Amp SHIM is there
  ansible.builtin.assert:
      that: "'sndrpihifiberry' in audio_cards.stdout"
      fail_msg: >-
          no card sndrpihifiberry in 'aplay -l' - check {{ base_boot_config }} (dtoverlay=hifiberry-dac) and whether
          the box was restarted
      quiet: true

- name: Sound settings /etc/asound.conf
  ansible.builtin.copy:
      src: "{{ tinyjukebox_checkout }}/deploy/config/asound.conf"
      remote_src: true
      dest: /etc/asound.conf
      owner: root
      group: root
      mode: "0644"
  notify: Restart tinyjukebox

- name: Look up the volume control Softmaster
  ansible.builtin.command: amixer sget Softmaster
  register: audio_softmaster
  changed_when: false
  failed_when: false

# the control only exists after the device has been opened once; alsactl store keeps it over a restart
- name: Volume control Softmaster
  ansible.builtin.shell:
      cmd: aplay -q -d 1 -f cd /dev/zero && amixer sget Softmaster && alsactl store
  when: audio_softmaster.rc != 0
  changed_when: true

# Spotify (docs/developer/box.md, sections 4 and 5): Soloist plays only into PipeWire or PulseAudio. The box
# starts its own PipeWire with a pipe as its only output; what the packages switch on for every user would take the
# sound card and Bluetooth, so it is masked
- name: Packages for Spotify are installed
  ansible.builtin.apt:
      name: [pipewire, wireplumber, libatomic1]
      state: present
      install_recommends: false
      update_cache: true
      cache_valid_time: 86400

- name: The sound servers of the packages do not start for users
  ansible.builtin.command: >-
      systemctl --global mask pipewire.socket pipewire.service wireplumber.service
      pipewire-pulse.socket pipewire-pulse.service
  args:
      creates: /etc/systemd/user/pipewire.socket

# "Connect" (docs/developer/architecture.md, section 4.1): Soloist announces itself only on UDP port 5353, which
# avahi-daemon holds. The box stops avahi for those minutes as its own user, with sudo -n: without this rule sudo
# refuses on a box whose user needs a password, and Soloist cannot be found in the Spotify app
- name: The box may stop and start avahi-daemon while Spotify connects
  ansible.builtin.copy:
      dest: /etc/sudoers.d/tinyjukebox-avahi
      content: |
          {{ tinyjukebox_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl stop avahi-daemon.socket avahi-daemon.service
          {{ tinyjukebox_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl start avahi-daemon.socket avahi-daemon.service
      owner: root
      group: root
      mode: "0440"
      validate: /usr/sbin/visudo -cf %s
