# config.txt (docs/developer/box.md) - a change needs a reboot
- name: No onboard audio
  ansible.builtin.replace:
      path: "{{ base_boot_config }}"
      regexp: '^(dtparam=audio=on.*)$'
      replace: '#\1'
  notify: Reboot

# hdmi would add sound cards of its own; the box has no display, the console works without this driver
- name: No vc4 driver
  ansible.builtin.replace:
      path: "{{ base_boot_config }}"
      regexp: '^(dtoverlay=vc4-kms-v3d.*)$'
      replace: '#\1'
  notify: Reboot

- name: Settings of the box
  ansible.builtin.blockinfile:
      path: "{{ base_boot_config }}"
      marker: "# {mark} Tiny Jukebox (ansible)"
      block: |
          [all]
          # rfid reader
          dtparam=spi=on
          # onboard audio off, Audio Amp SHIM
          dtparam=audio=off
          dtoverlay=hifiberry-dac
          gpu_mem=16
          disable_splash=1
          boot_delay=0
  notify: Reboot
