# what only the box of the developer gets beyond the installer (role install): hostname, time zone, locale, further
# wlans, ssh with key only, and the packages for building on the box (docs/developer/deployment.md, section 3)
- name: The system is Raspberry Pi OS trixie, 64 bit, with python 3.13
  ansible.builtin.assert:
      that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] == '13'
          - ansible_facts['architecture'] == 'aarch64'
          - ansible_facts['python_version'] is version('3.13', '>=')
      fail_msg: >-
          expected Debian 13 on aarch64 with python 3.13, found {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }} on {{ ansible_facts['architecture'] }} with python
          {{ ansible_facts['python_version'] }}
      quiet: true

- name: Packages
  ansible.builtin.import_tasks: packages.yaml

- name: Hostname, time zone, wlan, ssh
  ansible.builtin.import_tasks: system.yaml

