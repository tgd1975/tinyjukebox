# installs what is missing - never upgrades (apt full-upgrade is done by hand only). What a box needs to run comes
# with the installer (role install); here only what the repository on the box needs to build and to be updated
- name: Packages are installed
  ansible.builtin.apt:
      name:
          # lgpio and pyalsaaudio are built on the box; build-essential builds rfid-reader as well
          - swig
          - python3-dev
          - build-essential
          - liblgpio-dev
          - libasound2-dev
          # code, uv, albums (rsync)
          - git
          - curl
          - rsync
      state: present
      update_cache: true
      cache_valid_time: 86400
