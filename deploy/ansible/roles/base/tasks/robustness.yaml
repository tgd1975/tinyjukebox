# the box is switched off by cutting the power: write little, start fast (docs/developer/box.md)
- name: Look up which of the units to disable exist
  ansible.builtin.command:
      argv: "{{ ['systemctl', 'list-unit-files', '--no-legend'] + base_disabled_timers + base_disabled_services }}"
  register: base_unit_files
  changed_when: false
  failed_when: base_unit_files.rc not in [0, 1]  # 1: none of them exists

- name: No automatic updates, no services that only slow the start down
  ansible.builtin.systemd_service:
      name: "{{ item }}"
      enabled: false
      state: stopped
  loop: "{{ base_unit_files.stdout_lines | map('split') | map('first') | list }}"

- name: Folder for the journal settings
  ansible.builtin.file:
      path: /etc/systemd/journald.conf.d
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Journal in the ram
  ansible.builtin.copy:
      dest: /etc/systemd/journald.conf.d/tinyjukebox.conf
      content: |
          [Journal]
          Storage=volatile
      owner: root
      group: root
      mode: "0644"
  notify: Restart journald

- name: Root file system with noatime
  ansible.builtin.replace:
      path: /etc/fstab
      regexp: '^(\s*[^#\s]\S*\s+/\s+\S+\s+)(?!\S*\bnoatime\b)(\S+)'
      replace: '\1\2,noatime'
  notify: Remount the root file system
