# bluetooth headset: BlueZ and BlueALSA, the box is the sender (docs/developer/box.md,
# docs/developer/drivers.md)
- name: Packages for bluetooth are installed
  ansible.builtin.apt:
      name: [bluez, bluez-alsa-utils, rfkill]
      state: present
      update_cache: true
      cache_valid_time: 86400

- name: Group bluetooth for the user {{ tinyjukebox_user }}
  ansible.builtin.user:
      name: "{{ tinyjukebox_user }}"
      groups: [bluetooth]
      append: true

- name: Folder for the options of bluealsa
  ansible.builtin.file:
      path: /etc/systemd/system/bluealsa.service.d
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Options of bluealsa
  ansible.builtin.template:
      src: bluealsa-override.conf.j2
      dest: /etc/systemd/system/bluealsa.service.d/override.conf
      owner: root
      group: root
      mode: "0644"
  register: bluetooth_bluealsa_override

# here and not as a handler: before tinyjukebox is restarted
- name: Restart bluealsa with the new options  # noqa: no-handler
  ansible.builtin.systemd_service:
      name: bluealsa
      state: restarted
      daemon_reload: true
  when: bluetooth_bluealsa_override is changed

- name: Services bluetooth and bluealsa run
  ansible.builtin.systemd_service:
      name: "{{ item }}"
      enabled: true
      state: started
  loop: [bluetooth, bluealsa]

# a blocked adapter cannot be switched on by BlueZ ('Failed to set mode', the box logs 'Bluetooth - not available');
# systemd-rfkill keeps the state over a reboot
- name: State of the rfkill switch of bluetooth
  ansible.builtin.command: rfkill --noheadings --output SOFT list bluetooth
  register: bluetooth_rfkill
  changed_when: false

- name: Bluetooth is not blocked
  ansible.builtin.command: rfkill unblock bluetooth
  when: "'blocked' in bluetooth_rfkill.stdout_lines | map('trim')"
  changed_when: true

# plays sound *from* a phone - the box is the sender
- name: No bluealsa-aplay
  ansible.builtin.systemd_service:
      name: bluealsa-aplay
      enabled: false
      state: stopped
