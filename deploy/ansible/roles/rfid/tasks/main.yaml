# rfid reader: library bcm2835, fork RPi-MFRC522, helper program rfid-reader (docs/developer/box.md,
# docs/developer/rfid-reader.md)
- name: Source of bcm2835 {{ rfid_bcm2835_version }}
  ansible.builtin.get_url:
      url: "http://www.airspayce.com/mikem/bcm2835/bcm2835-{{ rfid_bcm2835_version }}.tar.gz"
      dest: "{{ tinyjukebox_root }}/cpp/bcm2835-{{ rfid_bcm2835_version }}.tar.gz"
      checksum: "sha256:{{ rfid_bcm2835_sha256 }}"
      mode: "0644"
  become: true
  become_user: "{{ tinyjukebox_user }}"

- name: Unpack bcm2835
  ansible.builtin.unarchive:
      src: "{{ tinyjukebox_root }}/cpp/bcm2835-{{ rfid_bcm2835_version }}.tar.gz"
      remote_src: true
      dest: "{{ tinyjukebox_root }}/cpp"
      creates: "{{ tinyjukebox_root }}/cpp/bcm2835-{{ rfid_bcm2835_version }}/configure"
  become: true
  become_user: "{{ tinyjukebox_user }}"

- name: Build bcm2835
  ansible.builtin.shell:
      cmd: ./configure && make
      chdir: "{{ tinyjukebox_root }}/cpp/bcm2835-{{ rfid_bcm2835_version }}"
      creates: "{{ tinyjukebox_root }}/cpp/bcm2835-{{ rfid_bcm2835_version }}/src/libbcm2835.a"
  become: true
  become_user: "{{ tinyjukebox_user }}"

- name: Install bcm2835
  ansible.builtin.command:
      cmd: make install
      chdir: "{{ tinyjukebox_root }}/cpp/bcm2835-{{ rfid_bcm2835_version }}"
      creates: /usr/local/lib/libbcm2835.a

# only the sources - rfid-reader compiles them itself
- name: Library RPi-MFRC522 in version {{ rfid_mfrc522_version }}
  ansible.builtin.git:
      repo: "{{ rfid_mfrc522_repo }}"
      dest: "{{ tinyjukebox_root }}/cpp/RPi-MFRC522"
      version: "{{ rfid_mfrc522_version }}"
  become: true
  become_user: "{{ tinyjukebox_user }}"

# make builds only if a source is newer than the program
- name: Build rfid-reader
  ansible.builtin.command:
      cmd: make MFRC522_DIR={{ tinyjukebox_root }}/cpp/RPi-MFRC522
      chdir: "{{ tinyjukebox_checkout }}/cpp/rfid-reader"
  environment:
      LC_ALL: C
  become: true
  become_user: "{{ tinyjukebox_user }}"
  register: rfid_make
  changed_when: "'is up to date' not in rfid_make.stdout"

# (with slots /usr/local/bin/rfid-reader is the launcher of the installer, which starts the rfid-reader of the active
# slot as root only if the release signed it or the installer listed it: role install, docs/developer/box.md, section 7)
- name: Install rfid-reader
  ansible.builtin.copy:
      src: "{{ tinyjukebox_checkout }}/cpp/rfid-reader/rfid-reader"
      remote_src: true
      dest: /usr/local/bin/rfid-reader
      owner: root
      group: root
      mode: "0755"
  when: not (tinyjukebox_slots | bool)
  notify: Restart tinyjukebox

# (the sudoers rule that lets the user start /usr/local/bin/rfid-reader as root comes with the installer: role install.
# Without slots it is this file of root, which the user cannot change)
