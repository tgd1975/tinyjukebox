# Slots (docs/developer/library.md, section 6): the box holds its software in slots, fetches new versions
# from the library by itself - without a library from the releases - and can go back. The playbook sets this up and
# installs the first version from a file, or lets a box without a library fetch it;
# from then on the box updates itself, and the playbook is the rescue path.
# With tinyjukebox_slots: false the box runs the code of its repository instead (role tinyjukebox).
- name: Tools of the slot scripts
  ansible.builtin.apt:
      name: [curl, jq, openssl, util-linux]
      state: present
      update_cache: true
      cache_valid_time: 86400

- name: Folders of the slots
  ansible.builtin.file:
      path: "{{ tinyjukebox_root }}/{{ item.name }}"
      state: directory
      owner: "{{ tinyjukebox_user }}"
      group: "{{ tinyjukebox_user }}"
      mode: "{{ item.mode }}"
  loop:
      - {name: slots, mode: "0755"}
      - {name: state, mode: "0755"}
      - {name: identity, mode: "0700"}  # the key of this box for the library
      - {name: sync, mode: "0755"}
  loop_control:
      label: "{{ tinyjukebox_root }}/{{ item.name }}"

# outside the slots: they change only through the playbook, so a version with a defective updater cannot lock the
# box in
- name: Folder of the slot scripts
  ansible.builtin.file:
      path: /usr/local/lib/tinyjukebox
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Slot scripts
  ansible.builtin.copy:
      src: "{{ tinyjukebox_local_repo }}/deploy/slot/{{ item.name }}"
      dest: "/usr/local/lib/tinyjukebox/{{ item.name }}"
      owner: root
      group: root
      mode: "{{ item.mode }}"
  loop:
      - {name: tinyjukebox-functions, mode: "0644"}
      - {name: tinyjukebox-slot, mode: "0755"}
      - {name: tinyjukebox-start, mode: "0755"}
  loop_control:
      label: "{{ item.name }}"

- name: Slot scripts in /usr/local/bin
  ansible.builtin.file:
      src: "/usr/local/lib/tinyjukebox/{{ item }}"
      dest: "/usr/local/bin/{{ item }}"
      state: link
  loop: [tinyjukebox-slot, tinyjukebox-start]

- name: Values of this box for the slot scripts
  ansible.builtin.template:
      src: slot.conf.j2
      dest: "{{ tinyjukebox_root }}/slot.conf"
      owner: "{{ tinyjukebox_user }}"
      group: "{{ tinyjukebox_user }}"
      mode: "0644"

# a slot is trusted because of its signature, not because of where it came from
- name: Public key of the releases
  ansible.builtin.copy:
      src: "{{ tinyjukebox_local_repo }}/deploy/release.pub"
      dest: "{{ tinyjukebox_root }}/release.pub"
      owner: root
      group: root
      mode: "0644"

# --- the library ------------------------------------------------------------------------------------------------------
- name: Address of the library
  ansible.builtin.copy:
      dest: "{{ tinyjukebox_root }}/identity/library"
      content: "{{ tinyjukebox_library_url }}\n"
      owner: "{{ tinyjukebox_user }}"
      group: "{{ tinyjukebox_user }}"
      mode: "0644"
  when: tinyjukebox_library_url | length > 0
  notify: Restart tinyjukebox

- name: Look up whether the box has a key of its own for the library
  ansible.builtin.stat:
      path: "{{ tinyjukebox_root }}/identity/key"
  register: slots_box_key

# only a box without a key gets the password: after its handshake the box deletes it, so that a stolen card does not
# give it away
- name: Bootstrap password for the first contact with the library
  ansible.builtin.copy:
      dest: "{{ tinyjukebox_root }}/identity/bootstrap"
      content: "{{ tinyjukebox_library_bootstrap }}\n"
      owner: "{{ tinyjukebox_user }}"
      group: "{{ tinyjukebox_user }}"
      mode: "0600"
  when:
      - tinyjukebox_library_url | length > 0
      - tinyjukebox_library_bootstrap | length > 0
      - not slots_box_key.stat.exists
  no_log: true
  notify: Restart tinyjukebox

# --- the releases: a box without a library ------------------------------------------------------------------------------
# only a private repository needs a token; without one the file is removed, so that taking the token out of the vault
# takes it off the box
- name: Token for the releases
  ansible.builtin.copy:
      dest: "{{ tinyjukebox_root }}/identity/releases-token"
      content: "{{ tinyjukebox_releases_token }}\n"
      owner: "{{ tinyjukebox_user }}"
      group: "{{ tinyjukebox_user }}"
      mode: "0600"
  when: tinyjukebox_releases_token | length > 0
  no_log: true

- name: No token for the releases
  ansible.builtin.file:
      path: "{{ tinyjukebox_root }}/identity/releases-token"
      state: absent
  when: tinyjukebox_releases_token | length == 0

# --- the first version ------------------------------------------------------------------------------------------------
- name: Look up the active slot
  ansible.builtin.stat:
      path: "{{ tinyjukebox_root }}/current/bin/tinyjukebox"
  register: slots_current

- name: Look up a version that waits for its first start
  ansible.builtin.stat:
      path: "{{ tinyjukebox_root }}/slots/next/bin/tinyjukebox"
  register: slots_next

# a box without a library fetches its first version itself, as it fetches every later one
- name: Whether the box can fetch its first version itself
  ansible.builtin.set_fact:
      slots_fetches: "{{ tinyjukebox_releases | length > 0 and tinyjukebox_library_url | length == 0 }}"

- name: A box without a slot needs a slot archive
  ansible.builtin.assert:
      that: >-
          slots_current.stat.exists or slots_next.stat.exists or slots_fetches
          or tinyjukebox_slot_archive | length > 0
      fail_msg: >-
          This box has no slot yet, and it cannot fetch one itself: it has a library, or no address of releases.
          Give the playbook the slot archive of a release:
          -e tinyjukebox_slot_archive=/path/to/tinyjukebox-box-VERSION-aarch64-debian-trixie.tar.gz
          (its .sig next to it; './fetch_release.sh' fetches both into dist/).
      quiet: true

- name: The first version, fetched by the box from the releases
  ansible.builtin.command:
      cmd: tinyjukebox-slot update --yes --by "playbook"
  become: true
  become_user: "{{ tinyjukebox_user }}"
  register: slots_fetched
  changed_when: "'is installed' in slots_fetched.stdout"
  failed_when: false
  when:
      - not slots_current.stat.exists
      - not slots_next.stat.exists
      - tinyjukebox_slot_archive | length == 0
      - slots_fetches
  notify: Restart tinyjukebox

- name: The box has fetched its first version
  ansible.builtin.assert:
      that: "'is installed' in slots_fetched.stdout"
      fail_msg: >-
          The box could not fetch its first version from {{ tinyjukebox_releases }}:
          {{ slots_fetched.stderr | default('') }} {{ slots_fetched.stdout | default('') }}
          Give the playbook the slot archive of a release instead:
          -e tinyjukebox_slot_archive=/path/to/tinyjukebox-box-VERSION-aarch64-debian-trixie.tar.gz
          (its .sig next to it; './fetch_release.sh' fetches both into dist/).
      quiet: true
  when: slots_fetched is not skipped

- name: Install a version from a file
  when: tinyjukebox_slot_archive | length > 0
  vars:
      slots_archive_files:
          - "{{ tinyjukebox_slot_archive }}"
          - "{{ tinyjukebox_slot_archive }}.sig"
          - "{{ tinyjukebox_slot_archive | regex_replace('\\.tar\\.gz$', '.json') }}"
  block:
      - name: Slot archive, its signature and its description on the box
        ansible.builtin.copy:
            src: "{{ item }}"
            dest: "/tmp/{{ item | basename }}"
            owner: "{{ tinyjukebox_user }}"
            mode: "0644"
        loop: "{{ slots_archive_files }}"

      # the version waits in slots/next and becomes active with the next start of the service; a version that is
      # installed already is installed again, which changes nothing
      - name: Version of the slot archive is installed
        ansible.builtin.command:
            cmd: tinyjukebox-slot update /tmp/{{ tinyjukebox_slot_archive | basename }} --yes --by "playbook"
        become: true
        become_user: "{{ tinyjukebox_user }}"
        register: slots_install
        changed_when: "'is installed' in slots_install.stdout"
        notify: Restart tinyjukebox

      - name: Remove the slot archive from /tmp
        ansible.builtin.file:
            path: "/tmp/{{ item | basename }}"
            state: absent
        loop: "{{ slots_archive_files }}"

# the first version of a box is its fallback version (docs/developer/library.md, section 6.10). A box that was set up
# before the slot script did that has none: it gets the version it runs, if that one is confirmed
- name: Look up the slots of the box
  ansible.builtin.command:
      cmd: tinyjukebox-slot status --json
  become: true
  become_user: "{{ tinyjukebox_user }}"
  register: slots_status
  changed_when: false

- name: A box without a fallback version gets the confirmed version it runs
  ansible.builtin.command:
      cmd: tinyjukebox-slot promote --by "playbook"
  become: true
  become_user: "{{ tinyjukebox_user }}"
  vars:
      slots_now: "{{ slots_status.stdout | from_json }}"
  when:
      - "'fallback' not in slots_now.slots"
      - (slots_now.slots[slots_now.active] | default({})).state | default('') == 'confirmed'

# --- commands and service -----------------------------------------------------------------------------------------------
# rfid-reader lies in the slot and is updated with it; the service calls it under this name with sudo (role rfid)
- name: Commands of the active slot in /usr/local/bin
  ansible.builtin.file:
      src: "{{ tinyjukebox_root }}/current/bin/{{ item }}"
      dest: "/usr/local/bin/{{ item }}"
      state: link
      force: true  # the link current exists only after the first start
      follow: false
  loop:
      - tinyjukebox
      - tinyjukebox-users
      - tinyjukebox-import-cards
      - tinyjukebox-migrate-01
      - tinyjukebox-fill-library
      - rfid-reader

- name: Service unit that starts the start script
  ansible.builtin.copy:
      src: "{{ tinyjukebox_local_repo }}/deploy/slot/tinyjukebox.service"
      dest: /etc/systemd/system/tinyjukebox.service
      owner: root
      group: root
      mode: "0644"
  notify: Restart tinyjukebox

- name: Service starts with the box
  ansible.builtin.systemd_service:
      name: tinyjukebox
      enabled: true
      daemon_reload: true
