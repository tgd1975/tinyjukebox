# the unit is installed and enabled here; it is started at the end of the play (handler, post_tasks)
# (with slots the unit starts the start script and is installed and enabled by the role slots)
- name: Service unit
  ansible.builtin.copy:
      src: "{{ tinyjukebox_checkout }}/deploy/scripts/tinyjukebox.service"
      remote_src: true
      dest: /etc/systemd/system/tinyjukebox.service
      owner: root
      group: root
      mode: "0644"
  when: not (tinyjukebox_slots | bool)
  notify: Restart tinyjukebox

- name: Service starts with the box
  ansible.builtin.systemd_service:
      name: tinyjukebox
      enabled: true
      daemon_reload: true
  when: not (tinyjukebox_slots | bool)
