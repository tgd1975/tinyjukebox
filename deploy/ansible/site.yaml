# Sets up the Tiny Jukebox box on a fresh Raspberry Pi OS Lite (trixie, 64 bit) - docs/developer/box.md,
# docs/developer/deployment.md.
#
#   ansible-playbook site.yaml --ask-vault-pass --ask-become-pass  # the box; may be run again at any time
#   ansible-playbook site.yaml --tags migrate -e migrate_albums_src=... -e migrate_json_src=...
#                                                                # once: albums and data of the old box
- name: Set up the Tiny Jukebox box
  hosts: tinyjukebox
  become: true

  roles:
      - role: base
        tags: [base]
      - role: tinyjukebox
        tags: [tinyjukebox]
      # the installer of a box: system, slots, first version; reboots for the firmware settings. After tinyjukebox:
      # with slots it replaces the service unit and the commands of that role (docs/developer/deployment.md)
      - role: install
        tags: [install]
      - role: rfid
        tags: [rfid]
      - role: migrate
        tags: [never, migrate]

  post_tasks:
      - name: The service tinyjukebox runs
        ansible.builtin.systemd_service:
            name: tinyjukebox
            state: started

      - name: The web page answers
        ansible.builtin.wait_for:
            port: 443
            timeout: 120
