# /etc/asound.conf of the box: the Audio Amp SHIM (dtoverlay=hifiberry-dac) has no volume control of its own -
# the default output goes through the software volume control 'Softmaster' (tinyjukebox.yaml: volume/mixer-control).
# The control only exists after the device has been opened once: aplay -q -d 1 -f cd /dev/zero
# The card is addressed by its name (aplay -l), not by its number - hdmi may add cards of its own.
pcm.!default {
    type plug
    slave.pcm "softvoldevice"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}

pcm.softvoldevice {
    type            softvol
    slave.pcm       "plughw:sndrpihifiberry"
    control.name    "Softmaster"
    control.card    sndrpihifiberry
}
