[project]
name = "tinyjukebox"
version = "0.36.0"
description = "RFID-controlled audio player for albums: state machines, ffmpeg/aplay playback, REST API and web page."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Tobias Gawron-Deutsch", email = "tobias@strix.at" }]
keywords = ["rfid", "audio player", "raspberry pi", "kids"]
requires-python = ">=3.11"
# What box and library both need. Drivers are imported on demand (tinyjukebox.devices.drivers), so the hardware
# libraries are only needed on a box: the extra 'box'.
dependencies = [
    "tantamount>=0.3.2,<0.4",  # stm/base.py works around bugs of 0.3.2
    "mutagen>=1.47",
    "jsonschema>=4.18",
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Environment :: Web Environment",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Typing :: Typed",
]

[project.optional-dependencies]
# the hardware of a box - not for the library: the NAS is aarch64 too, a marker alone would select them there
box = [
    # drop-in replacement for RPi.GPIO (same 'RPi.GPIO' module) - edge detection works on kernel 6.6+ as well
    "rpi-lgpio; platform_machine == 'aarch64' or platform_machine == 'armv7l' or platform_machine == 'armv6l'",
    # volume via alsa-lib - sdist only, built for the Pi (needs libasound2-dev)
    "pyalsaaudio>=0.11; platform_machine == 'aarch64' or platform_machine == 'armv7l' or platform_machine == 'armv6l'",
    # bluetooth driver: BlueZ via D-Bus (asyncio, no libdbus/glib)
    "dbus-fast>=5.0; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/tgd1975/tinyjukebox"
Documentation = "https://github.com/tgd1975/tinyjukebox/tree/master/docs"

[project.scripts]
tinyjukebox = "tinyjukebox.tinyjukebox:standalone"
tinyjukebox-library = "tinyjukebox.library.service:main"
tinyjukebox-users = "tinyjukebox.web.users:main"
tinyjukebox-backup = "tinyjukebox.tools.backup:main"
tinyjukebox-fill-library = "tinyjukebox.tools.fill_library:main"
tinyjukebox-import-cards = "tinyjukebox.tools.import_cards:main"
tinyjukebox-import-covers = "tinyjukebox.tools.import_covers:main"
tinyjukebox-migrate-01 = "tinyjukebox.tools.migrate_box01:main"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "psutil>=5.9",  # test_concurrency: no ffmpeg/aplay processes are left over
    "dbus-fast>=5.0; sys_platform == 'linux'",  # the tests of the bluetooth driver talk to a private bus
]
lint = [
    "ruff>=0.13",
    "mypy>=1.18",
    "types-PyYAML",
    "types-jsonschema",
    "types-psutil",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/tinyjukebox", "tests", "docs", "README.md", "LICENSE.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyjukebox"]  # incl. the web page (web/web/*)

# --- tests ---------------------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
timeout = 60
filterwarnings = ["error"]
log_level = "DEBUG"

[tool.coverage.run]
source = ["tinyjukebox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.", "if __name__ == .__main__.:"]

# --- linting / typing ----------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "A",             # builtins shadowing
    "C4",            # comprehensions
    "SIM",           # simplify
    "PT",            # pytest style
    "G",             # logging format
    "LOG",           # logging
    "S",             # bandit
    "PL",            # pylint
    "RUF",
]
ignore = [
    "PLR0913",  # constructors get their collaborators injected (testability)
    "PLR0917",
    "PLR2004",  # magic values in comparisons
    "RUF001",   # German texts and typographic characters are intended
    "S603",     # subprocess calls use argument lists, never a shell
    "S607",     # ffmpeg, aplay, amixer, openssl, pdftoppm are taken from PATH by design
    "RUF022",   # __all__ grouped by topic instead of sorted
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR0915", "PLC0415", "S311", "N802"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["tantamount.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# hardware libraries: not installed on x86, no type information
module = ["RPi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
warn_unreachable = false
disallow_untyped_defs = false  # test functions and small test doubles need no annotations
disallow_incomplete_defs = false
disallow_untyped_calls = false
